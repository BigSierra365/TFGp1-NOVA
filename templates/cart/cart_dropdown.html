<div class="absolute right-0 mt-2 w-64 bg-white rounded-lg shadow-lg z-50">
    <div class="p-4">
      <h3 class="text-lg font-semibold mb-2">Resumen rápido</h3>
      {% if cart.items.exists %}
        <ul>
          {% for item in cart.items.all|slice:":3" %}
            <li class="flex justify-between text-sm mb-1">
              {{ item.product.name }} x{{ item.qty }}
              <span>{{ item.subtotal }} €</span>
            </li>
          {% endfor %}
        </ul>
        <div class="mt-3 text-right">
          <p class="font-semibold">Total: {{ cart.total_price }} €</p>
          <a href="{% url 'cart_detail' %}" class="text-blue-600 hover:underline text-sm">Ir al carrito</a>
        </div>
      {% else %}
        <p class="text-sm text-gray-600">Carrito vacío.</p>
      {% endif %}
    </div>
  </div>
