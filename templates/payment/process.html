{% extends "base.html" %}
{% load static %}

{% block title %}Procesar Pago{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
  <!-- Breadcrumb -->
  <nav class="text-sm text-gray-500 mb-6" aria-label="Breadcrumb">
    <ol class="list-reset flex space-x-2">
      <li><a href="{% url 'home' %}" class="hover:text-blue-600">Inicio</a></li>
      <li>&#47;</li>
      <li><a href="{% url 'shopping_cart' %}" class="hover:text-blue-600">Carrito</a></li>
      <li>&#47;</li>
      <li class="text-gray-700">Pago</li>
    </ol>
  </nav>

  <div class="max-w-3xl mx-auto bg-white rounded-lg shadow p-6">
    <h1 class="text-2xl font-bold mb-6 text-center">Procesar Pago</h1>
    
    <div id="payment-form" class="space-y-6">
      <div class="text-center mb-6">
        <p class="text-gray-600 mb-4">Estás a punto de realizar un pago seguro mediante Stripe.</p>
        <div class="flex justify-center mb-4">
          <img src="{% static 'img/stripe-logo.png' %}" alt="Stripe" class="h-8" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/b/ba/Stripe_Logo%2C_revised_2016.svg/512px-Stripe_Logo%2C_revised_2016.svg.png'">
        </div>
      </div>
      
      <!-- Stripe Elements Placeholder -->
      <div id="card-element" class="border border-gray-300 p-4 rounded"></div>
      
      <!-- Error display -->
      <div id="card-errors" class="text-red-600 text-sm mt-2"></div>
      
      <!-- Submit button -->
      <button id="submit-button" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-md font-medium">
        <span id="button-text">Pagar Ahora</span>
        <span id="loading-spinner" class="hidden">Procesando...</span>
      </button>
    </div>
  </div>
</div>

{% endblock %}

{% block extra_scripts %}
<!-- Stripe JS -->
<script src="https://js.stripe.com/v3/"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Inicializar Stripe
    const stripe = Stripe('{{ STRIPE_PUBLISHABLE_KEY }}');
    const sessionId = '{{ session_id }}';
    
    // Redirigir al checkout de Stripe
    stripe.redirectToCheckout({
      sessionId: sessionId
    }).then(function (result) {
      if (result.error) {
        // Si hay un error, mostrar en la consola y en la interfaz
        console.error(result.error.message);
        const errorElement = document.getElementById('card-errors');
        errorElement.textContent = result.error.message;
      }
    });
  });
</script>
{% endblock %}
